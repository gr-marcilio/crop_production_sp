version: 2

models:
  - name: stg_producao
    description: >
      Tabela staging da produção por produto agrícola no estado de SP.
      Converte os campos originais de texto para numérico, substituindo valores inválidos ou nulos por 0.
      Segundo o site "https://sidra.ibge.gov.br/pesquisa/pam/tabelas", nas observações sobre a série histórica:
      2 - A partir do ano de 2001, as quantidades produzidas dos produtos: abacate, banana, caqui, figo, goiaba, laranja, limão, maçã, mamão, manga, maracujá, 
      marmelo, melancia, melão, pêra, pêssego e tangerina passam a ser expressas em toneladas. Nos anos anteriores, eram expressas em mil frutos, 
      com exceção da banana, que era expressa em mil cachos. O rendimento médio passa a ser expresso em Kg/ha. Nos anos anteriores, era expresso em frutos/ha, 
      com exceção da banana, que era expressa em cachos/ha.
      3 - As unidades de medida das plantas frutíferas foram alteradas em 2001. 
      A tabela de conversão de frutos em quilogramas encontra-se no documento: "https://sidra.ibge.gov.br/content/documentos/pam/AlteracoesUnidadesMedidaFrutas.pdf".
      4 - Até 2001, café (em coco); a partir de 2002, café (beneficiado ou em grão).
      6 - As quantidades produzidas de abacaxi e de coco-da-baía são expressas em mil frutos, e o rendimento médio em frutos/ha.
      
    columns:
      - name: ano
        description: Ano da coleta dos dados.
        tests:
          - not_null
      - name: total
        description: Produção total no Estado de São Paulo, 
      - name: abacate
        description: produção de abacate (mil frutos até o ano 2000 e toneladas a partir de 2001).
